# Бесплатные проекты Supabase засыпают после ~7 дней без запросов.
# Этот workflow раз в два дня обращается к базе и держит её активной.
# Ключ ниже — публикуемый (publishable), он безопасен для открытого репозитория.
#
# Как подключить: этот файл должен лежать в репозитории по пути
#   .github/workflows/keepalive.yml
# Проще всего — по ссылке-заготовке, которую я прислал (файл создаётся сразу с содержимым).

name: keep-alive Supabase

on:
  schedule:
    - cron: '0 6 */2 * *'      # каждые 2 дня в 06:00 UTC
  workflow_dispatch:            # запуск вручную: вкладка Actions → Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Пинг базы
        run: |
          U="https://nciyhaghjqddkqzuimff.supabase.co"
          K="sb_publishable_vL0U2ble-aE4F5juUPNXpQ_raUy-eaR"
          echo "тариф: $(curl -s -f -H "apikey: $K" "$U/rest/v1/tariff?select=version")"
          echo "перевозчиков: $(curl -s -f -H "apikey: $K" "$U/rest/v1/carriers?select=id&status=eq.verified" | grep -o id | wc -l) / 50 до выборов Совета"
